<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChoreQuest</title>
<style>
:root{--bg:#eef0ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--pr:#4f46e5;--hd:#4338ca;--ln:#e2e8f0;--ok:#059669;--bad:#e11d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1020;--card:#1b1d36;--tx:#e8eaf6;--mu:#9aa3c7;--ln:#2e3157;--hd:#3730a3}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:440px;margin:auto;padding:12px}
header{background:var(--hd);color:#fff;border-radius:18px;padding:14px;text-align:center}
header h1{margin:0;font-size:24px}header small{opacity:.75}
.tabs{display:flex;gap:8px;justify-content:center;margin-top:10px}
.tab{border:0;border-radius:99px;padding:7px 18px;font-weight:700;background:#ffffff30;color:#fff}.tab.on{background:#facc15;color:#312e81}
.bank{margin-top:10px;background:#00000030;border-radius:12px;padding:8px;color:#fde047;font-weight:700;display:flex;justify-content:space-around}
.pp{position:absolute;right:20px;top:20px;font-size:12px;border:0;border-radius:8px;background:#00000040;color:#fff;padding:5px 9px}
main{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-top:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;margin-top:10px;font:700 16px inherit;color:#fff;background:var(--pr)}
.btn.g{background:var(--ok)}.btn.r{background:#e11d48}.btn.s{background:none;color:var(--bad);border:1px solid var(--bad);padding:8px;font-size:13px}
.chore{background:var(--bg);border-radius:12px;padding:12px;border:1px solid var(--ln)}
.chore b{font-size:18px}.chore.read{position:sticky;top:6px;z-index:5;border:3px solid var(--pr);box-shadow:0 4px 14px #0003;text-align:center}.chore.read b{font-size:28px;line-height:1.25;display:block;margin:6px 0}.mu{color:var(--mu);font-size:13px}
.big{font:900 54px ui-monospace,monospace;text-align:center;color:var(--pr);margin:12px 0}
.pick{width:100%;text-align:left;border:2px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;margin-top:10px;font:700 15px inherit}
.ent{border:1px solid var(--ln);border-radius:12px;padding:10px;margin-top:10px}
.ent img{width:100%;border-radius:8px;margin-top:6px}.ent audio{width:100%;margin-top:6px}
input[type=password],input[type=text]{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;font-size:20px;text-align:center;background:var(--card);color:var(--tx)}
.row{display:flex;justify-content:space-between;gap:8px}.c{text-align:center}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}@keyframes rise{to{transform:translateY(-115vh) translateX(var(--dx))}}
@keyframes cross{from{left:-150px}to{left:100vw}}@keyframes boogie{0%,100%{transform:translateY(0) rotate(-14deg) scaleX(1)}25%{transform:translateY(-38px) rotate(10deg) scaleX(-1)}50%{transform:translateY(0) rotate(14deg) scaleX(-1)}75%{transform:translateY(-38px) rotate(-10deg) scaleX(1)}}
@keyframes bd{from{transform:translateY(26px) rotate(180deg) rotateY(0)}to{transform:translateY(26px) rotate(180deg) rotateY(360deg)}}@keyframes bf{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-95px) rotate(-180deg)}100%{transform:translateY(0) rotate(-360deg)}}@keyframes mw{0%,50%,100%{transform:scaleX(-1) translateX(0)}25%{transform:scaleX(-1) translateX(-12px) rotate(-5deg)}75%{transform:scaleX(-1) translateX(-12px) rotate(5deg)}}@keyframes tw{0%,100%{transform:translateY(22px) rotate(-9deg) skewX(-7deg) scaleY(.88)}50%{transform:translateY(22px) rotate(9deg) skewX(7deg) scaleY(.88)}}@keyframes sc{0%,100%{transform:rotate(-12deg) translateX(-8px)}50%{transform:rotate(12deg) translateX(8px)}}@keyframes fl{0%,100%{transform:translateX(-14px) skewX(-10deg)}50%{transform:translateX(14px) skewX(10deg)}}@keyframes wm{0%,100%{transform:translateY(30px) scale(1.3,.7)}50%{transform:translateY(30px) scale(.8,1.15) rotate(6deg)}}
.tag{background:#e0e7ff;color:#3730a3;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.btn:disabled{opacity:.5}
</style></head><body><div id="app"></div>
<script>
const PRI=[["p1","#1 Strip bed & put bedding by washer/dryer",5],["p2","#2 Pick up all things off room floor & put away",10],["p3","#3 Clean up your desk",10],["p4","#4 Make sure NOTHING is under your bed",5],["p5","#5 Vacuum your floor",10]].map(([id,t,m])=>({id,t,m}));
const POOL=[["r1","Empty all 7 garbages & replace bags",10],["r2","Vacuum the stairs",10],["r3","Straighten couch, fix cushions & take blanket to wash",5],["r4","Wipe down kitchen table really good",5],["r5","Take out recycles & replace bag",5],["r6","Pick up dog poop outside & put in outdoor trash",10],["r7","Spray back ways with Poo-Here spray until gone",10],["r8","Sweep downstairs & vacuum up piles",10],["r9","Mop downstairs",15],["r10","Clean kids bathroom (mirror, counters, floor, tub)",15],["r11","Clean all 3 toilets inside & out with Clorox wipes",15],["r12","Pick up garbage around back and sides of house",10],["r13","Dump overnight oats jars & soak mason jars in sink",15],["r14","Wipe down mirrors in all 3 bathrooms",15],["r15","Wash dishes in sink, put on rack & clean sink",15],["r16","Wipe down kitchen counters",5],["r17","Wipe coffee bar, Keurig, under ice maker & top shelf",20],["r18","Pick up dining chairs & vacuum under table with purple vacuum",10]].map(([id,t,m])=>({id,t,m}));
const KIDS=["Peyton","Carter"],KEY="chorequest-v1";
const kid0=()=>({bank:0,step:0,done:0,redo:[],pair:[],chosen:null,breakEnd:0});
let S={pin:"1234",taken:[],doneIds:[],log:[],ld:{start:0,lockEnd:0,last:""},kids:{Peyton:kid0(),Carter:kid0()}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.kids)S=s}catch(e){}
S.ld=S.ld||{start:0,lockEnd:0,last:""};S.taken=S.taken||[];S.doneIds=S.doneIds||[];
let U={who:"Peyton",parent:false,authed:false,stage:"READ",audio:null,photo:null,rec:null,end:0,left:0,msg:""};
let dbDoc=null,syncOn=false;
const $=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>(n<0?"-$":"$")+Math.abs(n).toFixed(2);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(dbDoc){try{dbDoc.set({json:JSON.stringify(S)}).catch(()=>{})}catch(e){}}}

// --- Shared sync via Google Sheet (Apps Script web app) ---
const SHEET_URL="https://script.google.com/macros/s/AKfycbyghrw1-BxLu3B7OixM3GuEdQu_GFn9oarGPsZMgOMS7v_aWnTevTsNnLTxLe9Vj__g/exec";
S.synced=S.synced||[];
function remotePush(entry){
 S.synced=S.synced||[];
 if(!S.synced.includes(entry.ts))S.synced.push(entry.ts);
 S.synced=S.synced.slice(-1000);save();
 try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
  body:JSON.stringify({child:entry.child,chore:entry.title,earnings:entry.earned,timestamp:entry.ts,photo:entry.photo||"",photo2:entry.photo0||""})}).catch(()=>{})}catch(e){}
}
function pic(u){const m=/[?&]id=([\w-]+)/.exec(u||"");return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1200":u}
let pulling=false;
async function remotePull(){
 if(pulling)return;pulling=true;
 try{
  const r=await fetch(SHEET_URL);
  if(!r.ok)return;
  const rows=await r.json();
  if(!Array.isArray(rows))return;
  let changed=false;
  rows.sort((x,y)=>Number(x[3])-Number(y[3]));
  for(const row of rows){
   const child=row[0],title=String(row[1]||""),earned=parseFloat(row[2])||0,ts=Number(row[3]);
   let photoUrl=String(row[4]||""),photo0=String(row[5]||"");
   if(!/^https?:/.test(photoUrl))photoUrl="";if(!/^https?:/.test(photo0))photo0="";
   if(!ts||S.synced.includes(ts))continue;
   if(child==="PLAN"){S.synced.push(ts);changed=true;try{applyPlan(JSON.parse(title),ts)}catch(e){}continue}
   if(!S.kids[child])continue;
   S.synced.push(ts);changed=true;
   const K=S.kids[child];
   if(title.indexOf("REJECT:")===0){
    const rest=title.slice(7),bar=rest.indexOf("|"),tgt=Number(bar<0?rest:rest.slice(0,bar)),note=bar<0?"":rest.slice(bar+1),ex=S.log.find(x=>x.ts===tgt);
    if(ex)doReject(ex,note);
    continue;
   }
   K.bank=+(K.bank+earned).toFixed(2);
   const entry={id:"j"+ts,child,title,earned,ts,remote:1};if(photoUrl)entry.photo=photoUrl;if(photo0)entry.photo0=photo0;
   if(title.indexOf("🧺")===0){
    entry.laundry=1;entry.seen=0;
    const sw=title.indexOf("Switched")>=0;
    if(!entry.seen&&!sw)entry.start=1;
    if(ts>(S.ld.at||0))S.ld={start:ts,lockEnd:sw?ts+LL:0,last:child,at:ts};
   }else{
    const pit=S.plan&&S.plan.items.find(i=>i.t===title&&!S.doneIds.includes(i.id));
    if(K.redo.some(r=>r.t===title))K.redo=K.redo.filter(r=>r.t!==title);
    if(pit){entry.cid=pit.id;S.doneIds.push(pit.id);if(pit.who==="either"&&!S.taken.includes(pit.id))S.taken.push(pit.id);if(K.chosen&&K.chosen.id===pit.id){K.chosen=null;K.pair=[]}}
    else{
     const pi=PRI.findIndex(c=>c.t===title),ri=POOL.findIndex(c=>c.t===title);
     const cid=pi>=0?PRI[pi].id:ri>=0?POOL[ri].id:null;
     if(cid){entry.cid=cid;if(!S.doneIds.includes(cid))S.doneIds.push(cid)}
     if(pi>=0&&K.step<pi+1)K.step=pi+1;
     if(ri>=0&&!S.taken.includes(POOL[ri].id))S.taken.push(POOL[ri].id);
     if(ri>=0&&K.chosen&&K.chosen.id===POOL[ri].id){K.chosen=null;K.pair=[]}
    }
    K.done++;
   }
   S.log.unshift(entry);S.log=S.log.slice(0,25);
  }
  S.synced=S.synced.slice(-1000);
  if(changed){save();const ae=document.activeElement;if(!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))render()}
 }catch(e){}finally{pulling=false}
}
setInterval(remotePull,15000);
setTimeout(remotePull,1500);
const rate=s=>Math.round(s/2)/100;
const poolList=()=>S.plan?S.plan.items.filter(i=>i.who==="either"):POOL;
function planNext(k){const K=S.kids[k],mine=S.plan.items.filter(i=>i.who===k&&!S.doneIds.includes(i.id));if(mine.length)return mine[0];if(K.chosen&&!S.doneIds.includes(K.chosen.id))return K.chosen;return null}
function cur(k){const K=S.kids[k];if(K.redo.length)return K.redo[0];if(S.plan)return planNext(k);if(K.step<5)return PRI[K.step];return K.chosen}
const okC=c=>{if(S.taken.includes(c.id))return false;const o=c.orig||c.id;if(o!=="r9")return true;if(!S.plan)return S.doneIds.includes("r8");const sw=S.plan.items.find(i=>i.orig==="r8");return !sw||S.doneIds.includes(sw.id)};
function newPair(K){const a=poolList().filter(okC).sort(()=>Math.random()-.5);K.pair=a.slice(0,2);K.chosen=null}
function applyPlan(items,ts){if(ts<=(S.planAt||0))return;S.planAt=ts;S.plan=items&&items.length?{ts,items}:null;for(const n of KIDS){S.kids[n].chosen=null;S.kids[n].pair=[]}}
function setPlan(items){const ts=Date.now();S.planAt=ts;S.plan=items&&items.length?{ts,items}:null;
 for(const n of KIDS){S.kids[n].chosen=null;S.kids[n].pair=[]}
 S.synced.push(ts);save();
 try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({child:"PLAN",chore:JSON.stringify(items||[]),earnings:0,timestamp:ts})}).catch(()=>{})}catch(x){}}
function tick(){const now=Date.now();
 if(U.stage==="TIMER")U.left=Math.max(0,Math.ceil((U.end-now)/1000));
 const K=S.kids[U.who];if(K.breakEnd&&now>=K.breakEnd){K.breakEnd=0;save()}
 const t=document.getElementById("t");if(t&&U.stage==="TIMER")t.textContent=fmt(U.left);
 const b=document.getElementById("b");if(b&&K.breakEnd)b.textContent=fmt(Math.ceil((K.breakEnd-now)/1000));
 if(U.stage==="TIMER"&&U.left===0&&!U.warned){U.warned=1;render()}
 else if(U.stage==="TIMER"){const f=document.getElementById("fin"),el=U.d0-U.left;if(f){if(el<U.need)f.textContent="Finish unlocks in "+fmt(U.need-el);else if(f.disabled)render()}}
 ldTick()}
setInterval(tick,500);
const words=s=>{const m=Math.floor(s/60),r=s%60,p=[];if(m)p.push(m+(m===1?" minute":" minutes"));if(r||!m)p.push(r+(r===1?" second":" seconds"));return p.join(" ")};
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const TOTAL=14;
function planProg(){const its=S.plan.items,dn=its.filter(i=>S.doneIds.includes(i.id)).length,p=its.length?Math.round(dn/its.length*100):0;
 return`<div class="ent" style="background:var(--card);margin:12px 0 0"><div class="row"><b>📅 Weekend chores</b><span class="mu">${dn} of ${its.length} done</span></div><div style="height:14px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--ln)"><div style="height:100%;width:${p}%;background:var(--pr);border-radius:99px"></div></div><div class="mu" style="margin-top:6px">${KIDS.map(n=>n+": "+its.filter(i=>i.who===n&&!S.doneIds.includes(i.id)).length+" assigned left").join(" · ")}</div></div>`}
function progCard(){if(S.plan)return planProg();return`<div class="ent" style="background:var(--card);margin:12px 0 0">`+KIDS.map((n,i)=>{const K=S.kids[n],d=Math.max(0,K.step-K.redo.length),p=Math.min(100,Math.round(d/TOTAL*100));return`<div style="${i?"margin-top:10px":""}"><div class="row"><b>${n}</b><span class="mu">${d} of ${TOTAL} chores</span></div><div style="height:14px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--ln)"><div style="height:100%;width:${p}%;background:${i?"#ec4899":"var(--pr)"};border-radius:99px"></div></div></div>`}).join("")+`</div>`}
const DANCES=[{c:"🦖",l:"Dino Breakdance",a:"bd .8s linear infinite"},{c:"🐸",l:"Froggy Backflips",a:"bf .9s ease-in-out infinite"},{c:"🐧",l:"Penguin Moonwalk",a:"mw .7s ease-in-out infinite"},{c:"🐻",l:"Bear Booty Shake",a:"tw .18s ease-in-out infinite"},{c:"🤖",l:"Robot Shopping Cart",a:"sc .5s ease-in-out infinite",x:"🛒"},{c:"🦄",l:"Unicorn Floss",a:"fl .45s ease-in-out infinite"},{c:"🐛",l:"Caterpillar Worm",a:"wm .6s ease-in-out infinite"}];
function dance(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const ph=["Chore CRUSHED!","Boom! Squeaky clean!","Nailed it!","Piggy bank party! 🐷","Look at you go!",U.who+" is a legend!"],p=a=>a[Math.floor(Math.random()*a.length)];
 let d;do{d=p(DANCES)}while(d.c===U.lastD&&DANCES.length>1);U.lastD=d.c;
 const st=`display:inline-block;line-height:1;animation:${d.a}`,o=document.createElement("div");o.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:998;overflow:hidden";
 o.innerHTML=`<div style="position:absolute;bottom:16%;left:-170px;text-align:center;animation:cross 5.5s linear forwards"><div style="background:#fff;color:#1e293b;font:700 14px system-ui;border-radius:14px;padding:6px 12px;box-shadow:0 3px 10px #0004;white-space:nowrap;margin-bottom:6px">${esc(p(ph))}<div style="font-size:11px;color:#6366f1">${d.l}</div></div><div style="white-space:nowrap"><span style="font-size:84px;${st}">${d.c}</span>${d.x?`<span style="font-size:56px;${st}">${d.x}</span>`:""}</div></div>`;
 document.body.appendChild(o);setTimeout(()=>o.remove(),6200)}
function party(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden";const cols=["#f43f5e","#facc15","#22c55e","#3b82f6","#a855f7","#fb923c"],r=Math.random;
 for(let i=0;i<80;i++){const d=document.createElement("div"),w=6+r()*8;d.style.cssText=`position:absolute;top:-24px;left:${r()*100}%;width:${w}px;height:${w*1.6}px;background:${cols[i%6]};border-radius:2px;animation:fall ${2.2+r()*2}s ${r()*.8}s linear forwards`;o.appendChild(d)}
 for(let i=0;i<30;i++){const d=document.createElement("div"),w=22+r()*40;d.style.cssText=`position:absolute;bottom:-60px;left:${r()*100}%;width:${w}px;height:${w}px;border-radius:50%;border:2px solid #ffffffcc;background:radial-gradient(circle at 30% 30%,#ffffffee,#7dd3fc55);--dx:${(r()-.5)*80}px;animation:rise ${3+r()*2.5}s ${r()*1.2}s ease-in forwards`;o.appendChild(d)}
 document.body.appendChild(o);setTimeout(()=>o.remove(),7500)}
const LC=45*60000,LL=45*60000;
function ldPhase(){const L=S.ld,n=Date.now();if(!L.start)return"idle";if(n<L.start+LC)return"run";if(n<L.lockEnd)return"wait";return"ready"}
function ldSecs(){const L=S.ld,n=Date.now(),t=ldPhase()==="run"?L.start+LC:L.lockEnd;return Math.max(0,Math.ceil((t-n)/1000))}
function ldCard(){const p=ldPhase(),L=S.ld,last=L.last?`<div class="mu">🧺 <b>${esc(L.last)}</b> started the last load${L.at?" at "+new Date(L.at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):""}</div>`:"";
 const box=(t,x)=>`<div class="ent" style="background:var(--card);text-align:center;margin:12px 0 0;border:2px solid ${p==="ready"?"var(--ok)":"var(--ln)"}"><b>🧺 Laundry</b><br>${t}${last}${x||""}</div>`;
 if(p==="idle")return box('<span class="mu">Timer not started.</span>','<button class="btn" data-a="ldstart">Start 45-minute laundry timer</button>');
 if(p==="run")return box('Switch the laundry in <b id="ldt" style="font:900 28px ui-monospace,monospace">'+fmt(ldSecs())+'</b>');
 if(p==="wait")return box('Laundry is done, but switching is locked for another <b id="ldt">'+fmt(ldSecs())+'</b>');
 return box('<b style="color:var(--ok)">Time to switch the laundry!</b>',`<button class="btn g" data-a="ldclaim">Only push this button if you're the one switching the laundry (+$1.00 for ${U.who})</button>`)}
function ldTick(){const sig=ldPhase()+S.ld.start+S.ld.lockEnd;if(sig!==U.ldSig){U.ldSig=sig;if(!U.parent&&!U.rec&&(!document.activeElement||document.activeElement.tagName!=="INPUT"))render();return}
 const t=document.getElementById("ldt");if(t)t.textContent=fmt(ldSecs())}
const unseen=()=>S.log.filter(e=>e.laundry&&!e.seen).length;
function render(){
 const K=S.kids[U.who];
 let h=`<header style="position:relative"><button class="pp" data-a="pp">${U.parent?"Kids view":"🔒 Parent"+(unseen()?" 🔔 "+unseen():"")}</button><h1>ChoreQuest</h1><small>Peyton & Carter Edition</small>`;
 if(!U.parent)h+=`<div class="tabs">${KIDS.map(n=>`<button class="tab ${n===U.who?"on":""}" data-a="who" data-v="${n}">${n}</button>`).join("")}</div><div class="bank"><span>🐷 ${U.who}'s Piggy Bank</span><span>${money(K.bank)}</span></div>`;
 h+=`</header>`+progCard()+(U.parent?"":ldCard())+`<main>`+(U.parent?parentView():kidView(K))+`</main>`;
 $.innerHTML=h}
function kidView(K){
 if(K.breakEnd&&Date.now()<K.breakEnd)return`<div class="c"><div style="font-size:50px">🎉</div><h2>Break time!</h2><p class="mu">3 chores done. Rest, drink water.</p><div class="big" id="b">${fmt(Math.ceil((K.breakEnd-Date.now())/1000))}</div><button class="btn" data-a="skipbreak">Skip break</button></div>`;
 if(!S.plan&&K.step>=TOTAL&&!K.redo.length)return`<div class="c"><div style="font-size:50px">🏆</div><h2>All ${TOTAL} chores done!</h2><p class="mu">Great work, ${U.who}!</p></div>`;
 if(S.plan?(!K.redo.length&&!cur(U.who)):(K.step>=5&&!K.redo.length&&!K.chosen)){if(!K.pair.length||K.pair.some(c=>!okC(c))){newPair(K);if(K.pair.length)save()}
  if(S.plan&&!K.pair.length)return S.plan.items.every(i=>S.doneIds.includes(i.id))?`<div class="c"><div style="font-size:50px">🏆</div><h2>Weekend list done!</h2><p class="mu">Great work, ${U.who}!</p></div>`:`<div class="c"><div style="font-size:44px">⏳</div><h3>Nothing to pick right now</h3><p class="mu">The rest of the weekend chores are assigned or already taken. Check back soon!</p></div>`;
  if(!K.pair.length)return`<div class="c"><div style="font-size:44px">⏳</div><h3>No chores to pick right now</h3><p class="mu">Mop downstairs unlocks after Sweep downstairs is finished. Check back soon!</p></div>`;
  return`<h3 class="c">Pick 1 of 2 chores:</h3>`+K.pair.map(c=>`<button class="pick" data-a="choose" data-v="${c.id}">${esc(c.t)}<div class="mu">⏰ ${c.m} min</div></button>`).join("")}
 const c=cur(U.who);
 let h=`<div class="chore${""}">${K.redo.length?`<span class="tag" style="background:#ffe4e6;color:#9f1239">REDO – parent sent it back</span><br>`:`<span class="mu">CURRENT CHORE</span><br>`}<b>${esc(c.t)}</b>${K.redo.length&&c.note?`<div style="margin:8px 0;padding:8px;border-radius:10px;background:#ffe4e6;color:#9f1239;text-align:left">💬 <b>Parent says:</b> ${esc(c.note)}</div>`:""}<div class="mu">${K.redo.length?"You have "+words(c.left!=null?c.left:c.m*60)+" remaining to complete this chore for your reward.":"Time limit: "+c.m+" min"}</div></div>`;
 if(U.msg)h+=`<p class="mu">${esc(U.msg)}</p>`;
 if(U.stage==="READ"){h+=`<p class="c mu">Step 1: Take a "before" photo of what you are about to work on.</p>${U.photo0?`<img src="${U.photo0}" style="width:100%;border-radius:10px">`:""}<label class="btn" style="text-align:center">📷 ${U.photo0?"Retake before photo":"Take before photo"}<input type="file" accept="image/*" capture="environment" data-a="photo0" hidden></label>`+(U.photo0?`<button class="btn g" data-a="start">Start timer & begin →</button>`:`<p class="c mu">The timer unlocks after you take the photo.</p>`)}
 else if(U.stage==="TIMER"){const el=U.d0-U.left,lk=el<U.need;h+=`<div class="big" id="t">${fmt(U.left)}</div><p class="c mu">Every second left when you finish = half a cent!</p><button class="btn g" id="fin" data-a="finish"${lk?" disabled":""}>${lk?"Finish unlocks in "+fmt(U.need-el):"I finished! Take photo →"}</button>${lk?`<p class="c mu">Take your time and do it well. The finish button unlocks after ${fmt(U.need)} of work.</p>`:""}`}
 else{h+=`<p class="c mu">Step 3: Photo of your finished work.</p>${U.photo?`<img src="${U.photo}" style="width:100%;border-radius:10px">`:""}
  <label class="btn" style="text-align:center">📷 ${U.photo?"Retake":"Take photo"}<input type="file" accept="image/*" capture="environment" data-a="photo" hidden></label>`;
  if(U.photo)h+=`<button class="btn g" data-a="submit">Submit & claim ${money(rate(U.left))} 💰</button>`}
 return h}
function parentView(){
 if(!U.authed)return`<p class="mu">Enter parent PIN:</p><input type="password" id="pin" inputmode="numeric" placeholder="••••"><button class="btn" data-a="login">Unlock</button>${U.msg?`<p class="c" style="color:var(--bad)">${esc(U.msg)}</p>`:""}`;
 if(U.edit)return planEditor();
 let h=(unseen()?`<div class="ent" style="background:#fef3c7;color:#92400e;border-color:#f59e0b">${S.log.filter(e=>e.laundry&&!e.seen).map(e=>`<div style="font-size:17px;margin-bottom:4px"><b>🔔 ${esc(e.child)} just ${e.start?"started":"switched"} the laundry!</b> <span style="font-size:12px">${new Date(e.ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</span></div>`).join("")}<button class="btn" style="background:#b45309" data-a="ack">Got it</button></div>`:"")+planBox()+`<h3 style="margin:0">Completed chores</h3><p class="mu">Tap the red button if a chore wasn't done right. The money is taken back and the chore returns to that child's list. Type a comment first and your child will see it (they can't reply).</p>`;
 if(!S.log.length)h+=`<p class="mu"><i>Nothing submitted yet.</i></p>`;
 for(const e of S.log)h+=`<div class="ent"><div class="row"><div>${e.laundry&&!e.seen?`<span class="tag" style="background:#fef3c7;color:#92400e">NEW</span> `:""}<span class="tag">${esc(e.child)}</span> <span class="mu">${new Date(e.ts).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</span><br><b>${esc(e.title)}</b></div><b style="color:var(--ok)">+${money(e.earned)}</b></div>${photosHtml(e)}${e.audio?`<audio controls src="${e.audio}"></audio>`:""}${e.laundry&&!e.earned?"":`<input type="text" data-cm="${e.id}" maxlength="200" placeholder="Comment for ${esc(e.child)} (optional)" value="${esc(U.cmt&&U.cmt[e.id]||"")}" style="margin-top:8px;font-size:15px;text-align:left"><button class="btn s" data-a="reject" data-v="${e.id}">${U.ask==="rej"+e.id?"⚠️ Tap again to confirm: deduct "+money(e.earned):"❌ Mark Incomplete & Deduct "+money(e.earned)}</button>`}</div>`;
 h+=`<hr style="border-color:var(--ln);margin:18px 0"><p class="mu">Change PIN:</p><input type="text" id="np" inputmode="numeric" placeholder="New PIN"><button class="btn" data-a="setpin">Save PIN</button><hr style="border-color:var(--ln);margin:18px 0"><button class="btn r" data-a="reset">${U.ask==="reset"?"⚠️ Tap again to ERASE EVERYTHING":"⚠️ Reset app (erase everything)"}</button>${U.note?`<p class="c"><b>${esc(U.note)}</b></p>`:""}<p class="mu c">Clears both piggy banks, all progress and the log. The PIN stays the same.</p><p class="mu c">Data is saved on this device only. Parents: review chores and laundry alerts on the same device the kids use.</p>`;
 return h}
function photosHtml(e){const a=[["Before",e.photo0],["After",e.photo]].filter(x=>x[1]);if(!a.length)return"";return`<div class="row" style="margin-top:6px;align-items:flex-start">`+a.map(([l,u])=>`<div style="flex:1;min-width:0"><div class="mu">${l}</div><img style="margin-top:2px" src="${pic(u)}" referrerpolicy="no-referrer"></div>`).join("")+`</div>`}
const WHO=[["","Not this weekend"],["Peyton","Peyton"],["Carter","Carter"],["either","Either one (shared pile)"]];
function planBox(){
 let h=`<div class="ent" style="background:var(--bg)"><b>📅 Weekend chores</b>`;
 if(S.plan){const its=S.plan.items,dn=its.filter(i=>S.doneIds.includes(i.id)).length;
  h+=`<div class="mu">Weekend plan is ON for both kids. ${dn} of ${its.length} done.</div>`;
  for(const [k,l] of [["Peyton","Peyton"],["Carter","Carter"],["either","Either one (shared pile)"]]){const a=its.filter(i=>i.who===k);if(a.length)h+=`<div style="margin-top:8px"><span class="tag">${l}</span>${a.map(i=>`<div class="mu">${S.doneIds.includes(i.id)?"✅":"⬜"} ${esc(i.t)}</div>`).join("")}</div>`}
  h+=`<button class="btn" data-a="plan">Edit weekend chores</button><button class="btn s" data-a="planoff">${U.ask==="planoff"?"⚠️ Tap again: go back to the regular chore list":"Turn off weekend plan"}</button>`}
 else h+=`<div class="mu">Pick which chores each child does this weekend, or put some in a shared pile. Right now both kids use the regular list.</div><button class="btn" data-a="plan">Assign weekend chores</button>`;
 return h+(U.pnote?`<p class="c"><b>${esc(U.pnote)}</b></p>`:"")+`</div>`}
function openPlan(){const cp=S.plan?S.plan.items:[];
 const d=PRI.concat(POOL).map(c=>{const p=cp.find(i=>i.orig===c.id);return{t:c.t,m:c.m,orig:c.id,who:p?p.who:""}});
 cp.filter(i=>!i.orig).forEach(i=>d.push({t:i.t,m:i.m,orig:"",who:i.who}));
 U.draft=d;U.edit=true}
function planEditor(){
 let h=`<h3 style="margin:0">📅 Weekend chores</h3><p class="mu">Choose who does each chore. <b>Either one</b> chores go in a shared pile the kids pick from, first come first served. Chores set to "Not this weekend" are left out.</p>${U.pnote?`<p class="c" style="color:var(--bad)"><b>${esc(U.pnote)}</b></p>`:""}`;
 const sel="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:15px";
 U.draft.forEach((c,i)=>{h+=`<div class="ent"><b>${esc(c.t)}</b><div class="mu">⏰ ${c.m} min${c.orig?"":" · added by you"}</div><select data-a="asg" data-v="${i}" style="${sel}">${WHO.map(([v,l])=>`<option value="${v}"${c.who===v?" selected":""}>${l}</option>`).join("")}</select></div>`});
 h+=`<div class="ent" style="background:var(--bg)"><b>➕ Add your own chore</b><input type="text" id="nc" maxlength="80" placeholder="Chore name" style="margin-top:8px;font-size:15px;text-align:left"><select id="nm" style="${sel}">${[5,10,15,20,30,45,60].map(m=>`<option value="${m}"${m===15?" selected":""}>${m} minutes</option>`).join("")}</select><button class="btn" data-a="addc">Add to list</button></div>`;
 return h+`<button class="btn g" data-a="saveplan">Save weekend plan</button><button class="btn s" data-a="cancelplan" style="color:var(--tx);border-color:var(--ln)">Cancel</button>`}
const blobURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function shrink(file,mx=480,q=.6){return new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};i.src=URL.createObjectURL(file)})}
let mr=null;
async function toggleRec(){
 if(U.rec){mr.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];mr=new MediaRecorder(st,{audioBitsPerSecond:16000});
  mr.ondataavailable=e=>ch.push(e.data);
  mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(U.rt);U.audio=await blobURL(new Blob(ch,{type:mr.mimeType}));U.rec=false;render()};
  mr.start();U.rec=true;U.msg="";U.rt=setTimeout(()=>mr.state==="recording"&&mr.stop(),12000);render()}
 catch(e){U.micFail=1;U.msg="Microphone is blocked here. Use the phone recorder button below.";render()}}
function submit(){
 const K=S.kids[U.who],c=cur(U.who),earned=rate(U.left);
 const entry={id:"e"+Date.now(),child:U.who,cid:c.id,title:c.t,min:c.m,earned,left:U.left,ts:Date.now(),photo:U.photo,photo0:U.photo0,audio:U.audio};
 S.log.unshift(entry);
 S.log=S.log.slice(0,25);if(!S.doneIds.includes(c.id))S.doneIds.push(c.id);K.bank=+(K.bank+earned).toFixed(2);
 if(K.redo.length)K.redo.shift();else{K.step++;K.chosen=null;K.pair=[]}
 K.done++;if(K.done%3===0)K.breakEnd=Date.now()+600000;
 U.stage="READ";U.audio=U.photo=U.photo0=null;U.warned=0;U.msg="";save();render();dance();remotePush(entry)}
function reject(id){
 const e=S.log.find(x=>x.id===id);if(!e)return;
 const note=((U.cmt&&U.cmt[id])||"").trim().slice(0,200).replace(/\|/g,"/");
 doReject(e,note);
 const rts=Date.now();S.synced.push(rts);save();
 try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({child:e.child,chore:"REJECT:"+e.ts+(note?"|"+note:""),earnings:0,timestamp:rts})}).catch(()=>{})}catch(x){}
 if(U.cmt)delete U.cmt[id];
 render()}
function doReject(e,note){
 const K=S.kids[e.child];
 K.bank=+(K.bank-e.earned).toFixed(2);S.doneIds=S.doneIds.filter(x=>x!==e.cid);
 if(!e.laundry){const ch=PRI.concat(POOL).concat(S.plan?S.plan.items:[]).find(x=>x.id===e.cid);K.redo.push({id:e.cid,t:e.title,m:e.min||(ch?ch.m:10),left:e.left,note:note||""});K.breakEnd=0}
 S.log=S.log.filter(x=>x.id!==e.id);K.done=Math.max(0,K.done-1);save()}
$.addEventListener("click",ev=>{const t=ev.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v,K=S.kids[U.who],asked=U.ask;U.ask=null;U.note="";U.pnote="";
 if(a==="pp"){U.parent=!U.parent;U.authed=false;U.edit=false;U.msg="";render()}
 else if(a==="who"){U.who=v;U.stage="READ";U.audio=U.photo=U.photo0=null;U.msg="";render()}
 else if(a==="login"){if(document.getElementById("pin").value===S.pin){U.authed=true;U.msg=""}else U.msg="Wrong PIN";render()}
 else if(a==="setpin"){const p=document.getElementById("np").value.trim();if(p.length>=4){S.pin=p;save();U.note="✅ PIN saved."}else U.note="Use at least 4 digits.";render()}
 else if(a==="choose"){if(!okC(poolList().find(c=>c.id===v)||{id:v})){newPair(K)}else{S.taken.push(v);K.chosen=K.pair.find(c=>c.id===v)}save();render()}
 else if(a==="rec")toggleRec();
 else if(a==="start"){if(!U.photo0){U.msg="Take the before photo first.";render();return}const c=cur(U.who),d=c.left!=null?c.left:c.m*60;U.end=Date.now()+d*1000;U.left=d;U.d0=d;U.need=Math.min(d,Math.ceil(c.m*60/3));U.stage="TIMER";U.warned=0;U.msg="";render()}
 else if(a==="finish"){const lf=Math.max(0,Math.ceil((U.end-Date.now())/1000));if(U.d0-lf<U.need){render();return}U.left=lf;U.stage="PHOTO";render()}
 else if(a==="submit")submit();
 else if(a==="skipbreak"){K.breakEnd=0;save();render()}
 else if(a==="reset"){if(asked==="reset"){S={pin:S.pin,synced:S.synced||[],plan:null,planAt:S.planAt||0,taken:[],doneIds:[],log:[],ld:{start:0,lockEnd:0,last:""},kids:{Peyton:kid0(),Carter:kid0()}};U.stage="READ";U.audio=U.photo=U.photo0=null;U.warned=0;save();U.note="✅ App reset.";render()}else{U.ask="reset";render()}}
 else if(a==="ack"){S.log.forEach(e=>{if(e.laundry)e.seen=1});save();render()}
 else if(a==="ldstart"){const le={id:"l"+Date.now(),child:U.who,title:"🧺 Started the laundry",earned:0,ts:Date.now(),laundry:1,seen:0,start:1};S.ld={start:Date.now(),lockEnd:0,last:U.who,at:Date.now()};S.log.unshift(le);S.log=S.log.slice(0,25);save();party();render();remotePush(le)}
 else if(a==="ldclaim"){if(ldPhase()==="ready"){const n=Date.now();const le={id:"l"+n,child:U.who,title:"🧺 Switched the laundry",earned:1,ts:n,laundry:1,seen:0};S.ld={start:n,lockEnd:n+LL,last:U.who,at:n};K.bank=+(K.bank+1).toFixed(2);S.log.unshift(le);S.log=S.log.slice(0,25);save();party();remotePush(le)}render()}
 else if(a==="plan"){openPlan();render()}
 else if(a==="planoff"){if(asked==="planoff"){setPlan(null);U.pnote="✅ Weekend plan turned off. Everyone is back on the regular list.";render()}else{U.ask="planoff";render()}}
 else if(a==="addc"){const nm=document.getElementById("nc").value.trim(),mm=Number(document.getElementById("nm").value)||15;
  if(!nm)U.pnote="Type a chore name first.";
  else if(U.draft.some(c=>c.t.toLowerCase()===nm.toLowerCase()))U.pnote="That chore is already on the list.";
  else U.draft.push({t:nm.slice(0,80),m:mm,orig:"",who:"either"});render()}
 else if(a==="saveplan"){const ts=Date.now(),items=U.draft.filter(c=>c.who).map((c,i)=>({id:"w"+ts+"-"+i,t:c.t,m:c.m,who:c.who,orig:c.orig||""}));
  if(!items.length){U.pnote="Pick at least one chore, or tap Cancel.";render();return}
  setPlan(items);U.edit=false;U.pnote="✅ Weekend plan saved. It will show up on every phone within about 15 seconds.";render()}
 else if(a==="cancelplan"){U.edit=false;render()}
 else if(a==="reject"){if(asked==="rej"+v)reject(v);else{U.ask="rej"+v;render()}}});
$.addEventListener("input",ev=>{const id=ev.target.dataset&&ev.target.dataset.cm;if(id){U.cmt=U.cmt||{};U.cmt[id]=ev.target.value}});
$.addEventListener("change",async ev=>{if(ev.target.dataset.a==="asg"){U.draft[Number(ev.target.dataset.v)].who=ev.target.value;return}if(ev.target.dataset.a==="photo0"&&ev.target.files[0]){U.photo0=await shrink(ev.target.files[0],360,.5);render();return}if(ev.target.dataset.a==="audiofile"&&ev.target.files[0]){const f=ev.target.files[0];if(f.size>600000){U.msg="That recording is too long. Record just a few seconds.";render();return}U.audio=await blobURL(f);U.msg="";render();return}if(ev.target.dataset.a==="photo"&&ev.target.files[0]){U.photo=await shrink(ev.target.files[0]);render()}});
render();
(async()=>{try{const db=await claude.use("db");if(!db)return;dbDoc=db.doc("chorequest/state");
 dbDoc.onSnapshot(s=>{if(s.exists&&s.data()&&s.data().json&&!s.metadata.hasPendingWrites){try{const n=JSON.parse(s.data().json);if(n&&n.kids){n.ld=n.ld||{start:0,lockEnd:0,last:""};n.taken=n.taken||[];n.doneIds=n.doneIds||[];S=n;localStorage.setItem(KEY,JSON.stringify(S));if(!U.rec&&U.stage!=="TIMER"&&document.activeElement.tagName!=="INPUT")render()}}catch(e){}}else if(!s.exists)save()});
 syncOn=true}catch(e){}})();
