const KIDS=["Peyton","Carter"],KEY="chorequest-v1";
const kid0=()=>({bank:0,step:0,done:0,rolls:0,redo:[],pair:[],chosen:null,breakEnd:0});
let S={pin:"1234",taken:[],doneIds:[],log:[],ld:{start:0,lockEnd:0,last:""},kids:{Peyton:kid0(),Carter:kid0()}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.kids)S=s}catch(e){}
S.ld=S.ld||{start:0,lockEnd:0,last:""};S.taken=S.taken||[];S.doneIds=S.doneIds||[];
let U={who:"Peyton",parent:false,authed:false,stage:"READ",audio:null,photo:null,rec:null,end:0,left:0,msg:""};
let dbDoc=null,syncOn=false;
const $=document.getElementById("app");

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){
  try{(S.log||[]).forEach(x=>{if(x.photo&&x.photo.indexOf("data:")===0)delete x.photo;if(x.photo0&&x.photo0.indexOf("data:")===0)delete x.photo0;delete x.audio});localStorage.setItem(KEY,JSON.stringify(S))}catch(e2){SY.err="Storage full: "+e2}}
 if(dbDoc){try{dbDoc.set({json:JSON.stringify(S)}).catch(()=>{})}catch(e){}}}

// --- Shared sync via Google Sheet (Apps Script web app) ---
const SHEET_URL="https://script.google.com/macros/s/AKfycbyghrw1-BxLu3B7OixM3GuEdQu_GFn9oarGPsZMgOMS7v_aWnTevTsNnLTxLe9Vj__g/exec";
S.synced=S.synced||[];
function remotePush(entry){
 S.synced=S.synced||[];
 if(!S.synced.includes(entry.ts))S.synced.push(entry.ts);
 S.synced=S.synced.slice(-1000);save();
 try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
  body:JSON.stringify({child:entry.child,chore:(entry.by==="parent"?"PARENT|":"")+entry.title,earnings:entry.earned,timestamp:entry.ts,photo:entry.photo||"",photo2:entry.photo0||""})}).catch(()=>{})}catch(e){}
}
function pic(u){const m=/[?&]id=([\w-]+)/.exec(u||"");return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1200":u}
let pulling=false,pf=0,pw=0;
const canR=()=>{const ae=document.activeElement;return!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))&&Date.now()-(U.cam||0)>20000&&!U.rec};
async function remotePull(){
 if(pulling)return;pulling=true;
 try{
  const r=await fetch(SHEET_URL);
  if(!r.ok){SY.err="Server answered "+r.status;pf++;pw=Math.min(9,pf);return}
  const rows=await r.json();
  if(!Array.isArray(rows)){SY.err="Sheet did not return a list (re-deploy Apps Script as New version, access: Anyone)";pf++;pw=Math.min(9,pf);return}
  pf=0;pw=0;SY.ok=Date.now();SY.err="";
  let changed=false;
  rows.sort((x,y)=>Number(x[3])-Number(y[3]));
  SY.rows=rows.length;
  for(const row of rows){ try{
   let title=String(row[1]||"");const child=row[0],earned=parseFloat(row[2])||0,ts=Number(row[3]);
   let by="";if(title.indexOf("PARENT|")===0){by="parent";title=title.slice(7)}
   let photoUrl=String(row[4]||""),photo0=String(row[5]||"");
   if(!/^https?:/.test(photoUrl))photoUrl="";if(!/^https?:/.test(photo0))photo0="";
   if(!ts||S.synced.includes(ts))continue;
   if(child==="PLAN"){S.synced.push(ts);changed=true;try{applyPlan(title==="OFF"?null:JSON.parse(title),ts)}catch(e){}continue}
   if(child==="RESET"){S.synced.push(ts);changed=true;wipe();continue}
   if(child==="CHORE"){S.synced.push(ts);changed=true;try{if(title.indexOf("DEL|")===0){const dt=title.slice(4).toLowerCase();S.custom=lib().filter(x=>x.t.toLowerCase()!==dt)}else if(title.indexOf("EDIT|")===0){const ed=JSON.parse(title.slice(5));applyEdit(String(ed.k),String(ed.t).slice(0,80),Number(ed.m)||10)}else{const c=JSON.parse(title);if(c&&c.t&&!lib().some(x=>x.t.toLowerCase()===String(c.t).toLowerCase()))lib().push({t:String(c.t).slice(0,80),m:Number(c.m)||15})}}catch(e){}continue}
   if(!S.kids[child])continue;
   S.synced.push(ts);changed=true;
   const K=S.kids[child];
   if(title.indexOf("REJECT:")===0){
    const rest=title.slice(7),bar=rest.indexOf("|"),tgt=Number(bar<0?rest:rest.slice(0,bar)),note=bar<0?"":rest.slice(bar+1),ex=S.log.find(x=>x.ts===tgt);
    if(ex)doReject(ex,note);
    continue;
   }
   if(/^(ROLL|MOVE)\|/.test(title)){try{applyGame(child,title,ts)}catch(e){}continue}
   if(title.indexOf("APPROVE|")===0){const at=Number(title.slice(8)),ae=S.log.find(x=>x.ts===at);if(ae&&ae.first&&!ae.ok)applyApprove(ae);continue}
   K.bank=+(K.bank+earned).toFixed(2);
   const entry={id:"j"+ts,child,title,earned,ts,remote:1};if(photoUrl)entry.photo=photoUrl;if(photo0)entry.photo0=photo0;if(by)entry.by=by;
   if(title.indexOf("🧺")===0){
    entry.laundry=1;entry.seen=0;
    const sw=title.indexOf("Switched")>=0;
    if(!entry.seen&&!sw)entry.start=1;
    if(ts>(S.ld.at||0))S.ld={start:ts,lockEnd:sw?ts+LL:0,last:child,at:ts};
   }else{
    const pit=S.plan&&(S.plan.items.find(i=>i.t===title&&i.who===child&&!S.doneIds.includes(i.id))||S.plan.items.find(i=>i.t===title&&i.who==="either"&&!S.doneIds.includes(i.id)));
    const rd=K.redo.find(r=>r.t===title),rl=(by||!rd||rd.rr)?1:0;entry.first=(rd||by)?0:1;entry.rolled=rl;K.rolls=(K.rolls||0)+rl;
    if(rd)K.redo=K.redo.filter(r=>r.t!==title);
    if(pit){entry.cid=pit.id;S.doneIds.push(pit.id);if(pit.who==="either"&&!S.taken.includes(pit.id))S.taken.push(pit.id);if(K.chosen&&K.chosen.id===pit.id){K.chosen=null;K.pair=[]}}
    else{
     const pi=PRI.findIndex(c=>c.t===title||c.t0===title),ri=POOL.findIndex(c=>c.t===title||c.t0===title);
     const cid=pi>=0?PRI[pi].id:ri>=0?POOL[ri].id:null;
     if(cid){entry.cid=cid;if(!S.doneIds.includes(cid))S.doneIds.push(cid)}
     if(pi>=0&&K.step<pi+1)K.step=pi+1;
     if(ri>=0&&!S.taken.includes(POOL[ri].id))S.taken.push(POOL[ri].id);
     if(ri>=0&&K.chosen&&K.chosen.id===POOL[ri].id){K.chosen=null;K.pair=[]}
    }
    K.done++;
   }
   S.log.unshift(entry);S.log=S.log.slice(0,25);
  }catch(rowErr){SY.err="Row error: "+rowErr}}
  S.synced=S.synced.slice(-1000);
  if(changed){save();if(canR())render();else U.dirty=true}
 }catch(e){SY.err="Can't reach sheet: "+e;pf++;pw=Math.min(9,pf)}finally{pulling=false;showSy()}
}
function syTxt(){const a=SY.ok?Math.max(0,Math.round((Date.now()-SY.ok)/1000)):-1;return (SY.err?"⚠️ "+SY.err:(a<0?"⏳ connecting…":"🟢 synced "+(a<5?"just now":a+"s ago")))+" · "+VER+" · "+SY.rows+" rows · tap to sync"}

const rate=s=>Math.round(s/2)/100;
const poolList=()=>S.plan?S.plan.items.filter(i=>i.who==="either"):POOL;
function planNext(k){const K=S.kids[k],mine=S.plan.items.filter(i=>i.who===k&&!S.doneIds.includes(i.id));if(mine.length)return mine[0];if(K.chosen&&!S.doneIds.includes(K.chosen.id))return K.chosen;return null}
function cur(k){const K=S.kids[k];if(K.redo.length)return K.redo[0];if(S.plan)return planNext(k);if(K.step<5)return PRI[K.step];return K.chosen}
const okC=c=>{if(S.taken.includes(c.id))return false;const o=c.orig||c.id;if(o!=="r9")return true;if(!S.plan)return S.doneIds.includes("r8");const sw=S.plan.items.find(i=>i.orig==="r8");return !sw||S.doneIds.includes(sw.id)};

function pushRow(child,chore){let ts=Date.now();while(S.synced.includes(ts))ts++;S.synced.push(ts);save();
 try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({child,chore,earnings:0,timestamp:ts})}).catch(()=>{})}catch(x){}}
function addLib(t,m){if(lib().some(x=>x.t.toLowerCase()===t.toLowerCase()))return;lib().push({t,m});save();pushRow("CHORE",JSON.stringify({t,m}))}
function delLib(t){S.custom=lib().filter(x=>x.t.toLowerCase()!==t.toLowerCase());save();pushRow("CHORE","DEL|"+t)}
function applyQ(){const q=(U.q||"").trim().toLowerCase();let n=0,t=0;document.querySelectorAll("[data-ct]").forEach(el=>{t++;const m=!q||el.dataset.ct.includes(q);el.style.display=m?"":"none";if(m)n++});const c=document.getElementById("cc");if(c)c.textContent=q?n+" of "+t+" chores match"+(n?"":". Not found? Add it at the bottom."):""}
function wipe(){S={pin:S.pin,synced:S.synced||[],plan:null,planAt:S.planAt||0,custom:lib(),ov:S.ov||{},game:null,taken:[],doneIds:[],log:[],ld:{start:0,lockEnd:0,last:""},kids:{Peyton:kid0(),Carter:kid0()}};U.stage="READ";U.audio=U.photo=U.photo0=null;U.warned=0;U.msg="";U.cmt={};U.turn=null;U.flash="";save()}
const navKey=()=>[U.who,U.parent?1:0,U.edit?1:0,U.resetPage?1:0].join()+(U.view==="game"&&!U.parent?",g":"");
function nav(){const k=navKey();if(U.navk===undefined){try{history.replaceState({k},"")}catch(e){}U.navk=k;return}if(k!==U.navk){try{history.pushState({k},"")}catch(e){}U.navk=k}}

 if(!U.parent&&(U.stage==="TIMER"||U.stage==="PHOTO")){try{history.pushState({k:U.navk},"")}catch(x){}U.msg="Back is paused while a chore is in progress. Finish the chore first.";render();return}
 const k=(e.state&&e.state.k)||"Peyton,0,0,0",a=k.split(","),wasP=U.parent;
 U.navk=k;U.view=a[4]==="g"?"game":"chores";if(KIDS.includes(a[0]))U.who=a[0];U.parent=a[1]==="1";U.edit=U.parent&&a[2]==="1";U.resetPage=U.parent&&a[3]==="1";U.ed="";U.ask=null;
 if(!U.parent||!wasP)U.authed=false;
 render()});

function ldSecs(){const L=S.ld,n=Date.now(),t=ldPhase()==="run"?L.start+LC:L.lockEnd;return Math.max(0,Math.ceil((t-n)/1000))}
function ldCard(){const p=ldPhase(),L=S.ld,last=L.last?`<div class="mu">🧺 <b>${esc(L.last)}</b> started the last load${L.at?" at "+new Date(L.at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):""}</div>`:"";
 const box=(t,x)=>`<div class="ent" style="background:var(--card);text-align:center;margin:12px 0 0;border:2px solid ${p==="ready"?"var(--ok)":"var(--ln)"}"><b>🧺 Laundry</b><br>${t}${last}${x||""}</div>`;
 if(p==="idle")return box('<span class="mu">Timer not started.</span>','<button class="btn" data-a="ldstart">Start 45-minute laundry timer</button>');
 if(p==="run")return box('Switch the laundry in <b id="ldt" style="font:900 28px ui-monospace,monospace">'+fmt(ldSecs())+'</b>');

const blobURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function shrink(file,mx=480,q=.6){return new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};i.src=URL.createObjectURL(file)})}

  mr.start();U.rec=true;U.msg="";U.rt=setTimeout(()=>mr.state==="recording"&&mr.stop(),12000);render()}

 else if(a==="choose"){if(!okC(poolList().find(c=>c.id===v)||{id:v})){newPair(K)}else{S.taken.push(v);K.chosen=K.pair.find(c=>c.id===v)}save();render()}
 else if(a==="rec")toggleRec();
 else if(a==="start"){if(!U.photo0){U.msg="Take the before photo first.";render();return}const c=cur(U.who),d=c.left!=null?c.left:c.m*60;U.end=Date.now()+d*1000;U.left=d;U.d0=d;U.need=Math.min(d,Math.ceil(c.m*60/3));U.stage="TIMER";U.warned=0;U.msg="";U.flash="";render()}
 else if(a==="finish"){const lf=Math.max(0,Math.ceil((U.end-Date.now())/1000));if(U.d0-lf<U.need){render();return}U.left=lf;U.stage="PHOTO";render()}
 else if(a==="submit")submit();
 else if(a==="skipbreak"){K.breakEnd=0;save();render()}
 else if(a==="mkopen"){U.mk="*";U.mkmsg="";render()}
 else if(a==="mkclose"){U.mk="";render()}
 else if(a==="mkwho"){U.mk=v;U.mkmsg="";render()}
 else if(a==="mkdo"){if(asked==="mk"+v){const c=markable(U.mk).find(x=>x.id===v);if(c){const en=parentDone(U.mk,c);U.mkmsg="✅ Marked \""+c.t+"\" done for "+U.mk+": +"+money(en.earned)+(en.rolled?" and 1 roll":"")+"."}render()}else{U.ask="mk"+v;render()}}
 else if(a==="view"){U.view=v;render()}
 else if(a==="roll"){if(!U.turn)doRoll(U.who);render()}
 else if(a==="turnok"){U.turn=null;render()}
 else if(a==="qskip"){const T=U.turn;if(T&&(T.stage==="fact"||T.stage==="word")){T.stage="done";T.res="Skipped. Maybe next time!"}render()}
 else if(a==="qans"){const T=U.turn;if(T&&T.stage==="fact"){const ok=Number(v)===T.q.c;finishQuiz(T.k,ok,(ok?"✅ Correct! ":"Not quite. ")+"The answer: "+T.q.o[T.q.c]+". "+T.q.f+(ok?" Move ahead 2!":""))}render()}
 else if(a==="wans"){const T=U.turn;if(T&&T.stage==="word"){const val=(document.getElementById("wa").value||"").trim().toUpperCase(),ok=val===T.q.w;finishQuiz(T.k,ok,(ok?"✅ You got it! ":"Not quite. ")+"The word was "+T.q.w+(ok?". Move ahead 2!":"."))}render()}
 else if(a==="pen"){const T=U.turn;if(T&&T.stage==="pen"){const keeper=Math.floor(Math.random()*3),ok=keeper!==Number(v);finishQuiz(T.k,ok,ok?"⚽ GOAL! The keeper dove the wrong way. Move ahead 3!":"🧤 Saved! Great try.",3)}render()}
 else if(a==="approve"){const ae=S.log.find(x=>x.id===v);if(ae&&ae.first&&!ae.ok){applyApprove(ae);save();pushRow(ae.child,"APPROVE|"+ae.ts)}render()}
 else if(a==="resetpage"){U.resetPage=true;U.rmsg="";render()}
 else if(a==="resetno"){U.resetPage=false;render()}
 else if(a==="resetgo"){const w=(document.getElementById("rc").value||"").trim().toUpperCase();
  if(w!=="RESET"){U.rmsg="Type the word RESET to confirm.";render();return}
  wipe();U.resetPage=false;U.rmsg="";pushRow("RESET","ALL");U.note="✅ Reset done. Every other phone resets within a few seconds.";render()}
 else if(a==="ack"){S.log.forEach(e=>{if(e.laundry)e.seen=1});save();render()}
 else if(a==="ldstart"){const le={id:"l"+Date.now(),child:U.who,title:"🧺 Started the laundry",earned:0,ts:Date.now(),laundry:1,seen:0,start:1};S.ld={start:Date.now(),lockEnd:0,last:U.who,at:Date.now()};S.log.unshift(le);S.log=S.log.slice(0,25);save();party();render();remotePush(le)}
 else if(a==="ldclaim"){if(ldPhase()==="ready"){const n=Date.now();const le={id:"l"+n,child:U.who,title:"🧺 Switched the laundry",earned:1,ts:n,laundry:1,seen:0};S.ld={start:n,lockEnd:n+LL,last:U.who,at:n};K.bank=+(K.bank+1).toFixed(2);S.log.unshift(le);S.log=S.log.slice(0,25);save();party();remotePush(le)}render()}
 else if(a==="plan"){openPlan();render()}
 else if(a==="planoff"){if(asked==="planoff"){setPlan(null);U.pnote="✅ Weekend plan turned off. Everyone is back on the regular list.";render()}else{U.ask="planoff";render()}}
 else if(a==="addc"){const nm=document.getElementById("nc").value.trim(),mm=Number(document.getElementById("nm").value)||15;
  if(!nm)U.pnote="Type a chore name first.";
  else if(U.draft.some(c=>c.t.toLowerCase()===nm.toLowerCase())||PRI.some(c=>c.t.toLowerCase()===nm.toLowerCase()))U.pnote="That chore is already on the list.";
  else{const nt=nm.slice(0,80);U.draft.push({t:nt,m:mm,orig:"",who:"either"});addLib(nt,mm);U.q="";U.pnote="✅ Added \""+nt+"\" and saved it in the app for good.";}render()}
 else if(a==="edc"){U.ed=U.ed===v?"":v;render()}
 else if(a==="cancelc"){U.ed="";render()}
 else if(a==="savec"){const nt=document.getElementById("et").value.trim().slice(0,80),nm=Number(document.getElementById("em").value)||10;
  const clash=PRI.concat(POOL).some(c=>c.id!==v&&c.t.toLowerCase()===nt.toLowerCase())||lib().some(c=>("T:"+c.t)!==v&&c.t.toLowerCase()===nt.toLowerCase());
  if(!nt)U.pnote="Type a chore name.";
  else if(clash)U.pnote="Another chore already has that name.";
  else{U.draft.forEach(c=>{if((c.orig||"T:"+c.t)===v){c.t=nt;c.m=nm}});applyEdit(v,nt,nm);pushRow("CHORE","EDIT|"+JSON.stringify({k:v,t:nt,m:nm}));U.ed="";U.pnote="✅ Saved. It updates on every phone within about 15 seconds."}
  render()}
 else if(a==="delc"){const di=Number(v);if(asked==="delc"+di){const dc=U.draft[di];if(dc){delLib(dc.t);U.draft.splice(di,1);U.pnote="Deleted \""+dc.t+"\" from the app."}render()}else{U.ask="delc"+di;render()}}
 else if(a==="saveplan"){const ts=Date.now(),items=[];U.draft.forEach((c,i)=>{if(!c.who)return;const w=c.who==="both"?KIDS:[c.who];w.forEach(k=>items.push({id:"w"+ts+"-"+i+(c.who==="both"?"-"+k:""),t:c.t,m:c.m,who:k,orig:c.orig||""}))});
  setPlan(items);U.edit=false;U.pnote="✅ Weekend plan saved. It will show up on every phone within about 15 seconds.";render()}
 else if(a==="cancelplan"){U.edit=false;render()}
 else if(a==="reject"){if(asked==="rej"+v)reject(v);else{U.ask="rej"+v;render()}}});
$.addEventListener("input",ev=>{if(ev.target.id==="cs"){U.q=ev.target.value;applyQ();return}const id=ev.target.dataset&&ev.target.dataset.cm;if(id){U.cmt=U.cmt||{};U.cmt[id]=ev.target.value}});
$.addEventListener("change",async ev=>{if(ev.target.dataset.a==="asg"){U.draft[Number(ev.target.dataset.v)].who=ev.target.value;return}if(ev.target.dataset.a==="photo0"&&ev.target.files[0]){U.photo0=await shrink(ev.target.files[0],360,.5);render();return}if(ev.target.dataset.a==="audiofile"&&ev.target.files[0]){const f=ev.target.files[0];if(f.size>600000){U.msg="That recording is too long. Record just a few seconds.";render();return}U.audio=await blobURL(f);U.msg="";render();return}if(ev.target.dataset.a==="photo"&&ev.target.files[0]){U.photo=await shrink(ev.target.files[0]);render()}});
for(const k in (S.ov||{}))applyEdit(k,S.ov[k].t,S.ov[k].m);
render();
(async()=>{try{const db=await claude.use("db");if(!db)return;dbDoc=db.doc("chorequest/state");
 dbDoc.onSnapshot(s=>{if(s.exists&&s.data()&&s.data().json&&!s.metadata.hasPendingWrites){try{const n=JSON.parse(s.data().json);if(n&&n.kids){n.ld=n.ld||{start:0,lockEnd:0,last:""};n.taken=n.taken||[];n.doneIds=n.doneIds||[];S=n;localStorage.setItem(KEY,JSON.stringify(S));if(!U.rec&&U.stage!=="TIMER"&&document.activeElement.tagName!=="INPUT")render()}}catch(e){}}else if(!s.exists)save()});
 syncOn=true}catch(e){}})();
</script></body></html>
